<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{g.title}} - تسجيل الدخول</title>
    <link rel="shortcut icon" href="/static/vite/favicon.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #4F46E5;
            --primary-dark: #4338CA;
            --primary-light: #818CF8;
            --success-color: #10B981;
            --danger-color: #EF4444;
            --text-dark: #1F2937;
            --text-light: #6B7280;
            --bg-light: #F9FAFB;
            --border-color: #E5E7EB;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* خلفية متحركة */
        .animated-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .animated-bg span {
            position: absolute;
            display: block;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            animation: move 25s linear infinite;
            bottom: -150px;
        }

        @keyframes move {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
                border-radius: 0;
            }
            100% {
                transform: translateY(-1000px) rotate(720deg);
                opacity: 0;
                border-radius: 50%;
            }
        }

        .animated-bg span:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .animated-bg span:nth-child(2) { left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
        .animated-bg span:nth-child(3) { left: 70%; width: 20px; height: 20px; animation-delay: 4s; }
        .animated-bg span:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
        .animated-bg span:nth-child(5) { left: 65%; width: 20px; height: 20px; animation-delay: 0s; }
        .animated-bg span:nth-child(6) { left: 75%; width: 110px; height: 110px; animation-delay: 3s; }
        .animated-bg span:nth-child(7) { left: 35%; width: 150px; height: 150px; animation-delay: 7s; }
        .animated-bg span:nth-child(8) { left: 50%; width: 25px; height: 25px; animation-delay: 15s; animation-duration: 45s; }
        .animated-bg span:nth-child(9) { left: 20%; width: 15px; height: 15px; animation-delay: 2s; animation-duration: 35s; }
        .animated-bg span:nth-child(10) { left: 85%; width: 150px; height: 150px; animation-delay: 0s; animation-duration: 11s; }

        .login-box {
            background: white;
            border-radius: 20px;
            box-shadow: var(--shadow-xl);
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 1;
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            padding: 40px 30px 30px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: white;
            border-radius: 20px;
            padding: 15px;
            box-shadow: var(--shadow-lg);
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .login-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .login-body {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.3s ease;
            background: var(--bg-light);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            background: white;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .form-input.error {
            border-color: var(--danger-color);
            background: #FEF2F2;
        }

        .error-message {
            display: none;
            color: var(--danger-color);
            font-size: 13px;
            margin-top: 6px;
        }

        .error-message.show {
            display: block;
        }

        .captcha-group {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .captcha-input {
            flex: 1;
        }

        .captcha-image {
            width: 120px;
            height: 48px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid var(--border-color);
            transition: transform 0.2s ease;
        }

        .captcha-image:hover {
            transform: scale(1.05);
        }

        .login-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-md);
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .qr-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .qr-toggle:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-lg);
        }

        .qr-section {
            display: none;
            text-align: center;
            padding: 40px 30px;
        }

        .qr-section.active {
            display: block;
        }

        .qr-code {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
        }

        .success-icon {
            width: 24px;
            height: 24px;
            background: var(--success-color);
            border-radius: 50%;
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
            align-items: center;
            justify-content: center;
        }

        .success-icon::after {
            content: '✓';
            color: white;
            font-size: 14px;
        }

        .success-icon.show {
            display: flex;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .login-container {
                padding: 15px;
            }

            .login-box {
                max-width: 100%;
                border-radius: 16px;
            }

            .login-header {
                padding: 30px 20px 20px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .login-body {
                padding: 30px 20px;
            }

            .logo {
                width: 60px;
                height: 60px;
            }

            .qr-toggle {
                width: 45px;
                height: 45px;
                top: 15px;
                left: 15px;
            }
        }

        @media (max-width: 480px) {
            .login-header h1 {
                font-size: 20px;
            }

            .form-input {
                padding: 12px 14px;
                font-size: 14px;
            }

            .login-button {
                padding: 14px;
                font-size: 15px;
            }

            .captcha-image {
                width: 100px;
                height: 44px;
            }
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            body {
                background: #111; /* Dark background for the whole page */
            }
            .login-box {
                background: #1F2937;
                color: #F9FAFB;
            }

            .form-label {
                color: #F9FAFB;
            }

            .form-input {
                background: #374151;
                border-color: #4B5563;
                color: #F9FAFB;
            }

            .form-input:focus {
                background: #4B5563;
            }

            .login-header {
                background: linear-gradient(135deg, #374151 0%, #1F2937 100%);
            }

            .qr-toggle {
                background: #374151;
            }

            .qr-code {
                background: #1F2937;
            }
        }

        .hide {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- خلفية متحركة -->
        <div class="animated-bg">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="login-box">
            <!-- زر التبديل لـ QR Code -->
            <div class="qr-toggle" onclick="toggleLoginMethod()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
            </div>

            <!-- رأس صفحة تسجيل الدخول -->
            <div class="login-header">
                <div class="logo">
                    <img src="/static/k2panel-logo.png" alt="K2Panel Logo">
                </div>
                <h1>{{g.title}}</h1>
                <p>مرحباً بك في لوحة التحكم</p>
            </div>

            <!-- نموذج تسجيل الدخول -->
            <div class="login-body" id="loginForm">
                <form method="post" id="loginFormElement">
                    <div class="form-group">
                        <label class="form-label">اسم المستخدم</label>
                        <div style="position: relative;">
                            <input type="text" name="username" class="form-input" placeholder="أدخل اسم المستخدم" required autocomplete="username">
                            <span class="success-icon"></span>
                        </div>
                        <span class="error-message">يرجى إدخال اسم المستخدم</span>
                    </div>

                    <div class="form-group">
                        <label class="form-label">كلمة المرور</label>
                        <div style="position: relative;">
                            <input type="password" name="password" class="form-input" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
                            <span class="success-icon"></span>
                        </div>
                        <span class="error-message">يرجى إدخال كلمة المرور</span>
                    </div>

                    <!-- Conditional rendering for captcha -->
                    {% if session['code'] %}
                    <div class="form-group">
                        <label class="form-label">رمز التحقق</label>
                        <div class="captcha-group">
                            <div class="captcha-input" style="position: relative;">
                                <input type="text" name="code" class="form-input" placeholder="أدخل رمز التحقق" required autocomplete="off">
                                <span class="success-icon"></span>
                            </div>
                            <img src="/code" class="captcha-image" alt="Captcha" onclick="this.src='/code?'+Math.random()" title="انقر للتحديث">
                        </div>
                        <span class="error-message">يرجى إدخال رمز التحقق</span>
                    </div>
                    {% endif %}

                    <button type="submit" class="login-button">
                        تسجيل الدخول
                    </button>
                </form>
            </div>

            <!-- قسم QR Code -->
            <div class="qr-section" id="qrSection">
                <h3 style="margin-bottom: 20px;">مسح رمز QR للدخول</h3>
                <div class="qr-code" id="qrCodeContainer">
                    <!-- QR Code will be generated here -->
                </div>
                <p style="color: var(--text-light); margin-top: 15px;">استخدم تطبيق K2Panel للمسح</p>
            </div>
        </div>
    </div>

    <script src="/static/js/md5.js"></script>
    <script src="/static/js/qrcode.min.js"></script>
    <script>
        let isQrMode = false;

        function toggleLoginMethod() {
            isQrMode = !isQrMode;
            const loginForm = document.getElementById('loginForm');
            const qrSection = document.getElementById('qrSection');

            if (isQrMode) {
                loginForm.classList.remove('active');
                loginForm.style.display = 'none';
                qrSection.classList.add('active');
                qrSection.style.display = 'block'; // Ensure it's visible
                initQRCode();
            } else {
                qrSection.classList.remove('active');
                qrSection.style.display = 'none';
                loginForm.style.display = 'block';
                loginForm.classList.add('active');
            }
        }

        function initQRCode() {
            const qrContainer = document.getElementById('qrCodeContainer');
            qrContainer.innerHTML = ''; // Clear previous QR code

            // Simulate QR code generation (replace with actual logic)
            const qrCodeInstance = new QRCode(qrContainer, {
                text: "https://example.com/qr-login-data", // Replace with actual dynamic data
                width: 200,
                height: 200,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }

        // Form validation
        document.getElementById('loginFormElement').addEventListener('submit', function(e) {
            e.preventDefault();

            const inputs = this.querySelectorAll('.form-input');
            let isValid = true;

            inputs.forEach(input => {
                const errorMsg = input.closest('.form-group').querySelector('.error-message');
                const successIcon = input.parentElement.querySelector('.success-icon');

                if (!input.value.trim()) {
                    input.classList.add('error');
                    errorMsg.classList.add('show');
                    successIcon.classList.remove('show');
                    isValid = false;
                } else {
                    input.classList.remove('error');
                    errorMsg.classList.remove('show');
                    successIcon.classList.add('show');
                }
            });

            if (isValid) {
                // Submit form
                // In a real scenario, you would submit the form or handle login via AJAX
                console.log("Form is valid, submitting...");
                // Example: this.submit();
                // For this example, we'll just show a success message
                alert("Login successful (simulated)!");
            }
        });

        // Remove error on input
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('input', function() {
                const errorMsg = this.closest('.form-group').querySelector('.error-message');
                this.classList.remove('error');
                errorMsg.classList.remove('show');
            });
        });

        // Prevent zoom on iOS
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });

        // Initialize login form visibility
        document.addEventListener('DOMContentLoaded', (event) => {
            const loginForm = document.getElementById('loginForm');
            const qrSection = document.getElementById('qrSection');
            // Ensure login form is visible by default
            loginForm.style.display = 'block';
            qrSection.style.display = 'none';
        });
    </script>
</body>
</html>
