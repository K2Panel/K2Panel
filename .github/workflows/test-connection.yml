# ==================== GitHub Actions: Test VPS Connection ====================
# اختبار الاتصال بـ VPS للتأكد من صحة SSH Secrets

name: Test VPS Connection

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Show detailed output'
        required: false
        default: 'false'
        type: boolean

jobs:
  test-connection:
    name: Test SSH Connection to VPS
    runs-on: ubuntu-latest
    
    steps:
      # ==================== الخطوة 1: التحقق من المتغيرات ====================
      - name: Validate environment variables
        run: |
          echo "🔍 Validating GitHub Secrets..."
          VALIDATION_FAILED=0
          
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "❌ VPS_HOST is not set"
            VALIDATION_FAILED=1
          else
            echo "✅ VPS_HOST is set"
          fi
          
          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "❌ VPS_USER is not set"
            VALIDATION_FAILED=1
          else
            echo "✅ VPS_USER is set"
          fi
          
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "❌ VPS_SSH_KEY is not set"
            VALIDATION_FAILED=1
          else
            echo "✅ VPS_SSH_KEY is set"
          fi
          
          if [ -z "${{ secrets.VPS_HOST_FINGERPRINT }}" ]; then
            echo "❌ VPS_HOST_FINGERPRINT is not set"
            echo ""
            echo "⚠️  Security Warning: Host fingerprint verification is REQUIRED to prevent MITM attacks"
            echo ""
            echo "📋 To get your VPS host fingerprint, run this command locally:"
            echo "   ssh-keyscan -H ${{ secrets.VPS_HOST }} 2>/dev/null | ssh-keygen -lf - | awk '{print \$2}'"
            echo ""
            echo "   OR connect to your VPS first and check: ~/.ssh/known_hosts"
            echo ""
            echo "Then add it as VPS_HOST_FINGERPRINT secret in:"
            echo "   https://github.com/${{ github.repository }}/settings/secrets/actions"
            VALIDATION_FAILED=1
          else
            echo "✅ VPS_HOST_FINGERPRINT is set"
          fi
          
          if [ $VALIDATION_FAILED -eq 1 ]; then
            echo ""
            echo "❌ Some secrets are missing. Please add them in:"
            echo "   https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          
          echo ""
          echo "✅ All required secrets are configured!"

      # ==================== الخطوة 2: تجهيز SSH Key ====================
      - name: Setup SSH key
        run: |
          echo "🔑 Setting up SSH key..."
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # جلب host key من الخادم
          echo "Fetching host key from ${{ secrets.VPS_HOST }}..."
          SCANNED_KEY=$(ssh-keyscan -H ${{ secrets.VPS_HOST }} 2>/dev/null)
          
          if [ -z "$SCANNED_KEY" ]; then
            echo "❌ Failed to get host key from server"
            exit 1
          fi
          
          # التحقق من البصمة (إلزامي للأمان)
          echo "🔐 Verifying host fingerprint..."
          ACTUAL_FINGERPRINT=$(echo "$SCANNED_KEY" | ssh-keygen -lf - | awk '{print $2}')
          
          if [ "$ACTUAL_FINGERPRINT" != "${{ secrets.VPS_HOST_FINGERPRINT }}" ]; then
            echo "❌ Host fingerprint mismatch!"
            echo "   Expected: ${{ secrets.VPS_HOST_FINGERPRINT }}"
            echo "   Actual: $ACTUAL_FINGERPRINT"
            echo ""
            echo "⚠️  SECURITY ALERT: Possible MITM attack detected!"
            echo "   The server's fingerprint does not match the expected value."
            echo "   This could indicate a man-in-the-middle attack or server change."
            exit 1
          fi
          echo "✅ Host fingerprint verified successfully"
          
          # إضافة المفتاح إلى known_hosts
          echo "$SCANNED_KEY" >> ~/.ssh/known_hosts
          
          echo "✅ SSH key configured"

      # ==================== الخطوة 3: اختبار الاتصال ====================
      - name: Test SSH connection
        run: |
          echo "🔌 Testing SSH connection to VPS..."
          echo ""
          
          # اختبار الاتصال مع التحقق من هوية الخادم
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=3 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo '✅ SSH Connection successful!'; echo ''; echo 'Server Info:'; uname -a; echo ''; echo 'Available disk space:'; df -h /"
          
          if [ $? -eq 0 ]; then
            echo ""
            echo "✅ Connection test passed!"
          else
            echo ""
            echo "❌ Connection test failed!"
            exit 1
          fi

      # ==================== الخطوة 4: التحقق من Docker ====================
      - name: Check Docker installation
        run: |
          echo "🐳 Checking Docker installation on VPS..."
          
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
          set -e
          
          echo "Checking Docker..."
          if ! which docker > /dev/null 2>&1; then
            echo "❌ Docker is not installed"
            exit 1
          fi
          docker --version
          
          echo ""
          echo "Checking Docker Compose..."
          if ! docker-compose --version > /dev/null 2>&1; then
            echo "❌ Docker Compose is not installed"
            exit 1
          fi
          docker-compose --version
          
          echo ""
          echo "✅ Docker and Docker Compose are installed"
          ENDSSH

      # ==================== الخطوة 5: التحقق من المسار ====================
      - name: Check deployment path
        run: |
          echo "📁 Checking deployment path /opt/k2panel..."
          
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
          
          if [ ! -d "/opt/k2panel" ]; then
            echo "⚠️  Directory /opt/k2panel does not exist"
            echo "Creating directory..."
            sudo mkdir -p /opt/k2panel
            sudo chown -R $USER:$USER /opt/k2panel
            echo "✅ Directory created"
          else
            echo "✅ Directory /opt/k2panel exists"
            ls -la /opt/k2panel/ || echo "Directory is empty"
          fi
          
          ENDSSH

      # ==================== الخطوة 6: النتيجة النهائية ====================
      - name: Summary
        if: success()
        run: |
          echo ""
          echo "### ✅ VPS Connection Test - PASSED ###"
          echo ""
          echo "All checks completed successfully!"
          echo "Your VPS is ready for K2Panel deployment."
          echo ""
          echo "Next steps:"
          echo "1. Run 'Build & Push Docker Image' workflow"
          echo "2. Run 'Deploy to VPS' or 'Blue-Green Deployment' workflow"

      # ==================== الخطوة 7: تنظيف ====================
      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up sensitive files..."
          rm -f ~/.ssh/deploy_key
          # إزالة host key من known_hosts
          if [ -f ~/.ssh/known_hosts ]; then
            ssh-keygen -R ${{ secrets.VPS_HOST }} 2>/dev/null || true
          fi
          echo "✅ Cleanup completed"

# ==============================================================================
# Workflow Features:
# - ✅ Validates all required GitHub Secrets
# - ✅ Tests SSH connection to VPS with host verification
# - ✅ Checks Docker installation (fails if missing)
# - ✅ Verifies deployment directory
# - ✅ Safe secret handling (cleanup)
# - ✅ Manual trigger only (workflow_dispatch)
# - ✅ Mandatory fingerprint verification (VPS_HOST_FINGERPRINT)
#
# Required Secrets:
# - VPS_HOST: VPS IP address or hostname
# - VPS_USER: SSH username
# - VPS_SSH_KEY: SSH private key
# - VPS_HOST_FINGERPRINT: SSH host fingerprint for MITM protection (e.g., SHA256:xxxxx...)
#
# How to get VPS_HOST_FINGERPRINT:
#   1. From your local machine: ssh-keyscan -H YOUR_VPS_IP | ssh-keygen -lf - | awk '{print $2}'
#   2. Or SSH to VPS first, then check: cat ~/.ssh/known_hosts
# ==============================================================================
